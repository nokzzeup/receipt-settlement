# Alembic config. Usually run from the repo root via npm:
#   npm run db:upgrade                  apply migrations
#   npm run db:revision "add xxx"       create a migration after changing models
#   npm run db:check                    check models vs migrations
# The DB URL is NOT set here: env.py uses DATABASE_URL from app/core/config.py (.env)
#
# KEEP THIS FILE ASCII-ONLY (no Korean comments). Alembic reads it with the OS locale
# encoding (cp949 on Korean Windows), so non-ASCII text crashes `alembic` there.
# tests/test_repo_files.py enforces this.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os

# file name: 20261004_<rev>_<message>.py -> sorted by date
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
